name: Bazel registry CI

permissions:
  contents: read

on:
  push:
    branches:
    - main
  pull_request:
  schedule:
  - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      module:
        description: Module to run (latest of every module if empty)
        type: string
      version:
        description: Module version (latest of the module if empty)
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true


jobs:
  request:
    runs-on: ubuntu-24.04
    outputs:
      entries: ${{ steps.select.outputs.entries }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
    - name: Test module selection
      run: python3 .github/workflows/registry_select_test.py
    - name: Test published registry derivation
      run: python3 .github/workflows/registry_published_test.py
    - name: Fetch pull request base SHA
      if: github.event_name == 'pull_request'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: git fetch --no-tags origin "+${BASE_SHA}"
    - name: Select modules
      id: select
      env:
        DIFF_BASE: >-
          ${{ github.event_name == 'pull_request'
              && github.event.pull_request.base.sha
              || github.event.before }}
        INPUT_MODULE: ${{ inputs.module }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        entries="$(python3 .github/workflows/registry_select.py \
            --event="${GITHUB_EVENT_NAME}" \
            --base="${DIFF_BASE}" \
            --module="${INPUT_MODULE}" \
            --version="${INPUT_VERSION}")"
        echo "Selected: ${entries}"
        echo "entries=${entries}" >> "$GITHUB_OUTPUT"

  modules:
    needs: request
    if: >-
      needs.request.outputs.entries != '[]'
    uses: ./.github/workflows/_bazel_registry.yml
    with:
      module: ${{ matrix.module }}
      version: ${{ matrix.version }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.request.outputs.entries) }}

  status:
    runs-on: ubuntu-24.04
    if: >-
      always()
      && github.event_name == 'pull_request'
    name: Bazel registry CI
    needs:
    - request
    - modules
    steps:
    - run: |
        if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
        fi
        echo "All required jobs passed or were skipped"
