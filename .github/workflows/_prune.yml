permissions:
  contents: read

on:
  workflow_call:
    secrets:
      app-id:
      app-key:
    inputs:
      committer-email:
        required: true
        type: string
      committer-name:
        required: true
        type: string
      dry-run:
        default: false
        type: boolean


jobs:
  prune:
    name: Prune unpublished module versions
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
    - uses: envoyproxy/toolshed/actions/appauth@5291901f6f40a2246c78b89698ead70d39a2559b  # actions-v0.4.20
      id: appauth
      name: Appauth
      if: >-
        ! inputs.dry-run
      with:
        app_id: ${{ secrets.app-id }}
        key: ${{ secrets.app-key }}
    - id: checkout
      name: Checkout the repository
      uses: envoyproxy/toolshed/actions/github/checkout@5291901f6f40a2246c78b89698ead70d39a2559b  # actions-v0.4.20
      with:
        branch: main
        committer-name: ${{ inputs.committer-name }}
        committer-email: ${{ inputs.committer-email }}
        token: ${{ steps.appauth.outputs.token }}
    - name: Fetch full history and tags
      run: |
        set -euo pipefail
        if [[ -f .git/shallow ]]; then
            git fetch --force --prune --tags --unshallow origin main
        else
            git fetch --force --prune --tags origin main
        fi
    - name: Resolve published baseline
      id: baseline
      env:
        GH_TOKEN: ${{ steps.appauth.outputs.token || github.token }}
      run: |
        set -euo pipefail
        published_ref="$(gh release view \
            --json tagName \
            --jq '.tagName // ""' \
            --repo "${{ github.repository }}" 2>/dev/null || true)"
        if [[ -n "${published_ref}" ]]; then
            echo "Published baseline: ${published_ref}"
        else
            echo "Published baseline: none (never published)"
        fi
        echo "published_ref=${published_ref}" >> "$GITHUB_OUTPUT"
    - name: Build prune plan
      id: plan
      env:
        PUBLISHED_REF: ${{ steps.baseline.outputs.published_ref }}
      run: |
        set -euo pipefail

        build_published_set() {
            local ref="$1"
            local modules_json='{}'
            local module

            if [[ -z "${ref}" ]]; then
                printf '{}\n'
                return
            fi

            while IFS= read -r module; do
                local metadata_json metadata_versions dir_versions versions
                local dir_names=()
                local line

                [[ -n "${module}" ]] || continue

                metadata_versions='[]'
                if metadata_json="$(git show "${ref}:modules/${module}/metadata.json" 2>/dev/null)"; then
                    metadata_versions="$(jq -c '.versions // []' <<< "${metadata_json}")"
                fi

                while IFS= read -r line; do
                    [[ -n "${line}" ]] || continue
                    dir_names+=("${line}")
                done < <(git ls-tree -d --name-only "${ref}:modules/${module}" 2>/dev/null || true)

                dir_versions='[]'
                if [[ ${#dir_names[@]} -gt 0 ]]; then
                    dir_versions="$(printf '%s\n' "${dir_names[@]}" | jq -Rsc 'split("\n")[:-1]')"
                fi

                versions="$(jq -cn \
                    --argjson metadata "${metadata_versions}" \
                    --argjson dirs "${dir_versions}" \
                    'reduce ($metadata + $dirs)[] as $version
                        ([]; if index($version) == null then . + [$version] else . end)')"

                modules_json="$(jq -cn \
                    --argjson modules "${modules_json}" \
                    --arg module "${module}" \
                    --argjson versions "${versions}" \
                    '$modules + {($module): $versions}')"
            done < <(git ls-tree -d --name-only "${ref}:modules" 2>/dev/null || true)

            printf '%s\n' "${modules_json}"
        }

        build_current_set() {
            local modules_json='{}'
            local metadata_path module_dir module metadata_versions dir_versions versions version_dir version
            local dir_names=()

            shopt -s nullglob
            for metadata_path in modules/*/metadata.json; do
                module_dir="$(dirname "${metadata_path}")"
                module="$(basename "${module_dir}")"
                metadata_versions="$(jq -c '.versions // []' "${metadata_path}")"
                dir_names=()

                for version_dir in "${module_dir}"/*/; do
                    version="${version_dir%/}"
                    version="${version##*/}"
                    dir_names+=("${version}")
                done

                dir_versions='[]'
                if [[ ${#dir_names[@]} -gt 0 ]]; then
                    dir_versions="$(printf '%s\n' "${dir_names[@]}" | jq -Rsc 'split("\n")[:-1]')"
                fi

                versions="$(jq -cn \
                    --argjson metadata "${metadata_versions}" \
                    --argjson dirs "${dir_versions}" \
                    'reduce ($metadata + $dirs)[] as $version
                        ([]; if index($version) == null then . + [$version] else . end)')"

                modules_json="$(jq -cn \
                    --argjson modules "${modules_json}" \
                    --arg module "${module}" \
                    --argjson versions "${versions}" \
                    '$modules + {($module): $versions}')"
            done
            shopt -u nullglob

            printf '%s\n' "${modules_json}"
        }

        published_json="$(build_published_set "${PUBLISHED_REF}")"
        current_json="$(build_current_set)"

        jq -cn \
            --argjson published "${published_json}" \
            --argjson current "${current_json}" \
            '{published: $published, current: $current}' \
            | jq -c -f .github/workflows/registry_prune_plan.jq > prune-plan.json

        jq -r \
            --arg actor "${{ github.actor }}" \
            --arg baseline "${PUBLISHED_REF}" \
            '[
                "Created by publish-envoy[bot] for @" + $actor,
                "",
                "Published baseline: "
                    + (if $baseline == "" then "none — never published" else $baseline end),
                "",
                "Removals:"
            ]
            + (map("- `\(.module)@\(.version)` (kept `\(.module)@\(.kept)`)"))
            | .[]' \
            prune-plan.json > prune-pr-body.txt

        echo "Prune plan: $(jq -c . prune-plan.json)"

        count="$(jq 'length' prune-plan.json)"
        echo "count=${count}" >> "$GITHUB_OUTPUT"
        if [[ "${count}" -eq 0 ]]; then
            echo "nothing to prune"
            echo "has_plan=false" >> "$GITHUB_OUTPUT"
        else
            echo "has_plan=true" >> "$GITHUB_OUTPUT"
        fi
        {
            echo "body<<EOF"
            cat prune-pr-body.txt
            echo "EOF"
        } >> "$GITHUB_OUTPUT"
    - name: Prune superseded versions
      if: steps.plan.outputs.has_plan == 'true'
      run: |
        set -euo pipefail

        jq -c '.[]' prune-plan.json | while IFS= read -r entry; do
            module="$(jq -r '.module' <<< "${entry}")"
            version="$(jq -r '.version' <<< "${entry}")"
            kept="$(jq -r '.kept' <<< "${entry}")"
            metadata_path="modules/${module}/metadata.json"
            changed=false

            if [[ -d "modules/${module}/${version}" ]]; then
                git rm -r -q "modules/${module}/${version}"
                changed=true
            fi

            tmp_metadata="$(mktemp /tmp/metadata.XXXXXX)"
            jq --indent 4 \
                --arg v "${version}" \
                '.versions -= [$v]
                 | if (.yanked_versions | type) == "object" then del(.yanked_versions[$v]) else . end' \
                "${metadata_path}" > "${tmp_metadata}"

            if ! cmp -s "${tmp_metadata}" "${metadata_path}"; then
                mv "${tmp_metadata}" "${metadata_path}"
                git add "${metadata_path}"
                changed=true
            else
                rm -f "${tmp_metadata}"
            fi

            if [[ "${changed}" != "true" ]]; then
                continue
            fi

            git commit -q --signoff \
                -m "prune: ${module} ${version}" \
                -m "Remove unpublished version ${module}@${version}, superseded before publication by ${module}@${kept}."
        done
    - name: Show dry-run commits
      if: inputs.dry-run && steps.plan.outputs.has_plan == 'true'
      run: |
        set -euo pipefail
        echo "Dry run: no pull request will be created"
        git log --stat --oneline --reverse origin/main..HEAD
    - name: Push prune branch
      if: >-
        ! inputs.dry-run
        && steps.plan.outputs.has_plan == 'true'
      env:
        BRANCH_NAME: prune/unpublished-versions/${{ github.run_id }}
        GH_TOKEN: ${{ steps.appauth.outputs.token || github.token }}
      run: |
        set -euo pipefail
        git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" \
            HEAD:"refs/heads/${BRANCH_NAME}"
    - name: Create Pull Request
      if: >-
        ! inputs.dry-run
        && steps.plan.outputs.has_plan == 'true'
      uses: envoyproxy/toolshed/actions/github/pr@98b13b6d4f551c27b406cb090d9ff7bf6877d1f6  # actions-v0.4.20 + fix
      with:
        base: main
        branch: prune/unpublished-versions/${{ github.run_id }}
        commit: false
        title: Prune superseded unpublished module versions
        body: ${{ steps.plan.outputs.body }}
        dry-run: ${{ inputs.dry-run }}
        GITHUB_TOKEN: ${{ steps.appauth.outputs.token || github.token }}
